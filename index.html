<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/4f7aa5bbf1.js" crossorigin="anonymous"></script>
    <title>Tech Wave</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
       *{
         margin: 0;
         padding: 0;
         list-style:none;
         box-sizing: border-box;
         outline:none;
         text-decoration: none;
        font-family: "Inter", sans-serif;
       }

   :root{
    --small-text-color:#ffffff;
    --bold-text-color:#00FF88;
    --grid-bg-color:#2a0f4d;
    --big-text-color:#2a0f4d;
    --body-bg-color:#1a0b2e;
    --small-text-font-size:1rem;
   }

    body{
        background-color: #1a0b2e;
        color:#ffff;
    }

    /* share style section  */
      .max-width{
        max-width: 1200px;
        margin: 0 auto;
        width: 90%;
      }
      .wave{
        background: linear-gradient(90deg,rgba(247, 233, 63, 1),rgba(251, 9, 180, 1),rgba(145, 0, 248, 1));
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
        animation:change 2s ease infinite alternate;
       }
       .btn{
        border:none;
        background:linear-gradient(45deg,rgba(247, 233, 63, 1),rgba(251, 9, 180, 1),rgba(145, 0, 248, 1));
        color:white;
        padding: 12px 20px;
        border-radius: 50px;
        cursor: pointer;
       }
       .btn:hover{
        background:linear-gradient(90deg,rgba(247, 233, 63, 1),rgba(251, 9, 180, 1),rgba(145, 0, 248, 1));
       }
     
    /* main style section */

     /* nav bar style section  */
    header{
        margin-top:20px;
    }
    header nav{
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    header nav ul{
        display: flex;
        align-items: center;
        gap:32px
    }
    header nav ul li a{
        color:var(--small-text-color);
        font-size:var(--small-text-font-size);
        position: relative;
        transition: all 1s ease;
    }

    header nav ul li a:hover{
        background: linear-gradient(90deg,#f8b05d,#fb0bb3,#9c01f1);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
    }

    header nav ul li a::before{
          content: '';
          position: absolute;
          height: 2px;
          width: 0%;
          background:linear-gradient(90deg,#f8b05d,#fb0bb3,#9c01f1);
          bottom: -2px;
          transition: width 1s ease;
    }

    header nav ul li a:hover::before{
        width: 100%;
    }

   @keyframes change{
     20%{ background: linear-gradient(90deg,#f8b05d,#fb0bb3,#9c01f1);
           -webkit-background-clip:text;
           -webkit-text-fill-color:transparent;
    }
     40%{ background: linear-gradient(45deg,#f8b05d,#fb0bb3,#9c01f1);
           -webkit-background-clip:text;
           -webkit-text-fill-color:transparent;
    }
     60%{ background: linear-gradient(180deg,#f8b05d,#fb0bb3,#9c01f1);
           -webkit-background-clip:text;
           -webkit-text-fill-color:transparent;
    }
     80%{ background: linear-gradient(100deg,#f8b05d,#fb0bb3,#9c01f1);
           -webkit-background-clip:text;
           -webkit-text-fill-color:transparent;
    }
     100%{ background: linear-gradient(30deg,#f8b05d,#fb0bb3,#9c01f1);
           -webkit-background-clip:text;
           -webkit-text-fill-color:transparent;
    }
   }

   header nav h2{
    font-size: 40px;
   }
   .btn2,.fa-arrow-right{
    transition:transform 1s ease;
   }


    .btn2:hover .fa-arrow-right{
        transform: translateX(20px);
      } 
    .btn2:hover{
        transform: scaleX(1.2);
    }







    </style>
</head>
<body>
    <header>
        <!-- navbar section -->
         <nav class="max-width">
            <h2>Tech<span class="wave">Wave</span></h2>
            <ul>
                <li><a href="#">About</a></li>
                <li><a href="#">Episodes</a></li>
                <li><a href="#">Host</a></li>
            </ul>
             <button class="btn btn2">Subscribe <i class="fa-solid fa-arrow-right"></i></button>
         </nav>
    </header>
    <main></main>
    <footer></footer>
</body>
</html>
