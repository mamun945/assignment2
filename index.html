<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/4f7aa5bbf1.js" crossorigin="anonymous"></script>
    <title>Tech Wave</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
       *{
         margin: 0;
         padding: 0;
         list-style:none;
         box-sizing: border-box;
         outline:none;
         text-decoration: none;
        font-family: "Inter", sans-serif;
       }

   :root{
    --small-text-color:#ffffff;
    --bold-text-color:#00FF88;
    --grid-bg-color:#2a0f4d;
    --big-text-color:#2a0f4d;
    --body-bg-color:#1a0b2e;
    --small-text-font-size:1rem;
   }

    body{
        background-color: #1a0b2e;
        color:#ffff;
    }

    /* share style section  */
      .max-width{
        max-width: 1200px;
        margin: 0 auto;
        width: 90%;
      }
      .wave{
        background: linear-gradient(90deg,rgba(247, 233, 63, 1),rgba(251, 9, 180, 1),rgba(145, 0, 248, 1));
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
        animation:change 2s ease infinite alternate;
       }
       .btn{
        border:none;
        background:linear-gradient(45deg,rgba(247, 233, 63, 1),rgba(251, 9, 180, 1),rgba(145, 0, 248, 1));
        color:white;
        padding: 12px 20px;
        border-radius: 50px;
        cursor: pointer;
       }
       .btn:hover{
        background:linear-gradient(180deg,rgba(247, 233, 63, 1),rgba(251, 9, 180, 1),rgba(145, 0, 248, 1));
        color: #000;       
    }
     
    /* main style section */

     /*---------- nav bar style section---------------  */
    header{
        margin-top:20px;
    }
    header nav{
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
     .manue{
        display: flex;
        align-items: center;
        gap:32px
    }
    header nav ul li a{
        color:var(--small-text-color);
        font-size:var(--small-text-font-size);
        position: relative;
        transition: all 1s ease;
    }

    header nav ul li a:hover{
        background: linear-gradient(90deg,#f8b05d,#fb0bb3,#9c01f1);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
    }

    header nav ul li a::before{
          content: '';
          position: absolute;
          height: 2px;
          width: 0%;
          background:linear-gradient(90deg,#f8b05d,#fb0bb3,#9c01f1);
          bottom: -2px;
          transition: width 1s ease;
    }

    header nav ul li a:hover::before{
        width: 100%;
    }

   @keyframes change{
     20%{ background: linear-gradient(90deg,#f8b05d,#fb0bb3,#9c01f1);
           -webkit-background-clip:text;
           -webkit-text-fill-color:transparent;
    }
     40%{ background: linear-gradient(45deg,#f8b05d,#fb0bb3,#9c01f1);
           -webkit-background-clip:text;
           -webkit-text-fill-color:transparent;
    }
     60%{ background: linear-gradient(180deg,#f8b05d,#fb0bb3,#9c01f1);
           -webkit-background-clip:text;
           -webkit-text-fill-color:transparent;
    }
     80%{ background: linear-gradient(100deg,#f8b05d,#fb0bb3,#9c01f1);
           -webkit-background-clip:text;
           -webkit-text-fill-color:transparent;
    }
     100%{ background: linear-gradient(30deg,#f8b05d,#fb0bb3,#9c01f1);
           -webkit-background-clip:text;
           -webkit-text-fill-color:transparent;
    }
   }

   header nav h2{
    font-size: 40px;
   }
   .btn2,.fa-arrow-right{
    transition:transform 1s ease;
   }


    .btn2:hover .fa-arrow-right{
        transform: translateX(20px);
      } 
    .btn2:hover{
        transform: scaleX(1.2);
    }
    .bar{
        display: none;
    }

    /*----------- hero banner section----------------  */
.banner{
    height: 500px;
    width: 100%;
    background-image: url('./assets/hero-bg.png');
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    margin-top:15px;
    border-top:.1px solid rgba(128, 128, 128, 0.326);
    position: relative;
}

.shadow1{
    position: absolute;
    height:100%;
    width:0%;
    left: 0;
    top:0;
    background-color:rgba(0,0,0,0.4);
    transition:all 1.2s ease;
}

  .banner:hover .shadow1{
    width:50%;
} 

.shadow2{
    position: absolute;
    height:100%;
    width:0%;
    right: 0;
    top:0;
    background-color:rgba(0,0,0,0.4);
    transition:all 1.2s ease;
}

 .banner:hover .shadow2{
    width:50%;
} 

.imgAndTextParent{
    max-width: 550px;
    margin:0 auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items:center;
    margin-top: 35px;
}

.image-div{
    height:260px;
    min-width:260px;
     position: relative;
}

.image-circle{
    width: 100%;
    height: 100%;
    background-image: url('./assets/hero-circle.png');
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover; 
    display: flex;
    align-items: center;
    justify-content: center;
    transition:transform 1s ease;
}
.image-circle img{
    max-width: 100px;
    height:auto;
}

.banner:hover .image-circle{
   transform: rotate(360deg) scale(1.1);
   filter: brightness(1) saturate(1);
} 

.new{
 position: absolute;
 z-index: 100;
 right:10px;
 top:0px;
 padding: 8px 18px;
 background-color: var(--bold-text-color);
 border-radius: 50px;
 color:black;
 font-size: 18px;
 font-weight: 600;
}

.text-section{
    margin-top:20px;
    position: relative;
    z-index: 100;
}
.text-section h2{
    font-size:50px;
    color:white;
    margin-bottom: 5px;
}

.text-section p{
    font-size:14px;
    font-weight: 400;
    margin-bottom:20px;
}

.banner-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    gap:20px;
    transition:gap 1s ease;
}
.banner:hover .banner-btn{
    gap: 100px;
}

.button{
    display: flex;
    align-items: center;
    gap:8px;
    animation: change2 2s ease infinite alternate;
    transition: transform 1s ease;
}
.button:hover{
    transform: scaleX(1.2);
}

@keyframes change2{
    40%{background:linear-gradient(45deg,rgba(247, 233, 63, 1),rgba(251, 9, 180, 1),rgba(145, 0, 248, 1));}
    80%{background:linear-gradient(90deg,rgba(247, 233, 63, 1),rgba(251, 9, 180, 1),rgba(145, 0, 248, 1));}
    100%{background:linear-gradient(180deg,rgba(247, 233, 63, 1),rgba(251, 9, 180, 1),rgba(145, 0, 248, 1));}
}

.button2{
     padding: 12px 20px;
     border-radius: 50px;
     cursor: pointer;
     display:flex;
     align-items: center;
     gap:8px;
     border:none;
     font-size:1rem;
     border:1px solid var(--bold-text-color);
     color:var(--bold-text-color);
     background-color: transparent;
     position: relative;
     overflow: hidden;
}

.button2::before{
    content:'';
    position: absolute;
    height:100%;
    width: 0%;
    background-color:#00ff8850;
    left: 0;
    top:0;
    transition: width 1s ease;
}

.button2:hover::before{
  width: 100%;
}





 /*----------------- mobile responsive------------ */

 @media screen and (max-width:576px) {
     .btn2{
        display:none;
     }
     .manue{
        display: none;
     }
     .bar{
        display: inline;
     }

     .banner-btn{
        flex-wrap: wrap;
        text-align: center;
     }
    
 }




    </style>
</head>
<body>
    <header>
        <!-- navbar section -->
         <nav class="max-width">
            <h2>Tech<span class="wave">Wave</span></h2>
            <ul class="manue">
                <li><a href="#">About</a></li>
                <li><a href="#">Episodes</a></li>
                <li><a href="#">Host</a></li>
            </ul>
             <button class="btn btn2">Subscribe <i class="fa-solid fa-arrow-right"></i></button>
             <img class="bar" src="./assets/hamburger-menu.png" alt="bar">
         </nav>

        <!-- hero banner section -->
         <section class="banner">
             <div class="imgAndTextParent">
                 <div class="shadow1"></div>
                 <div class="shadow2"></div>
                  <div class="image-div">
                     <p class="new">new</p>
                    <div class="image-circle">
                     <img src="./assets/microphone.png" alt="">
                    </div>
                  </div>

                  <div class="text-section">
                     <h2>TechWave</h2>
                     <p>Your daily dose of tech insights, productivity hacks, and personal growth</p>
                     <div class="banner-btn">
                        <button class="btn button"><img src="./assets/spotify.png" alt=""> <span>Listen on Spotify</span></button>
                        <button class="button2"><img class="subscribimg" src="./assets/message.png" alt=""> <span class="subscribe">Subscribe</span></button>
                     </div>
                    </div>
             </div>
         </section>
    </header>
    <main></main>
    <footer></footer>
</body>
</html>
